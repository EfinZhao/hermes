# Settings for tools/import_can_csv.py: which CAN devices to import, which of their signals
# become registry channels, and what those are called. Edit this for your own car; the
# importer code stays generic. Add one entry under `devices` per CAN device (ECU, expansion
# unit, PDM, dash ...), each with its own DBC file.
#
# Two kinds of device:
#   * fixed ids   (no base_id): messages keep the CAN ids written in the DBC.
#   * base + offsets (base_id set): the unit's CAN ids depend on a base set in its own
#     configuration (e.g. the E888: 0xF0, 0xF4, 0xF8 or 0xFC). Channels are stored as
#     can_base + can_offset, and the base value lives once in registry.yaml (`can_bases`),
#     so changing it never renumbers a channel. Two units of the same type (two E888s) are two
#     devices sharing one DBC, each with its own `name`, `base_id`, `first_id` and `prefix`.
#
# Ids are permanent once in registry.yaml. Each device gets an id block starting at `first_id`;
# blocks must not overlap (a device's block ends where the next higher first_id starts).

devices:
  - name: ecu                       # M130 engine ECU
    dbc: messaging/dbc/M1_General_0x640_0x650_0x670_Ver5.dbc   # relative to the repo root
    first_id: 300
    # messages to skip entirely (here: lower-resolution copies of other messages, sent to the PDM)
    skip_messages: [0x118, 0x119, 0x11A]
    # signals without a unit are skipped (switches, state enums, version bytes), except these
    keep_unitless: [Lap_Number]
    # channels with a hand-picked, permanent id (below first_id) and a friendly name.
    # Key = signal name in the DBC.
    pinned:
      Engine_Speed:        { id: 100, name: engine.speed_rpm, priority: 0, active: true }
      Coolant_Temperature: { id: 101, name: coolant.temp_c,   priority: 0, active: true }
      ECU_Battery_Voltage: { id: 102, name: ecu.battery_v,    priority: 1, active: true }
    # friendly names for channels that get an automatic id (others get a generated name,
    # e.g. ignition.timing_deg)
    names:
      Throttle_Position: throttle.position_pct
      Inlet_Manifold_Pressure: intake.manifold_kpa
      Wheel_Speed_Front_Left: wheel.speed_fl_kmh
      Wheel_Speed_Front_Right: wheel.speed_fr_kmh
      Wheel_Speed_Rear_Left: wheel.speed_rl_kmh
      Wheel_Speed_Rear_Right: wheel.speed_rr_kmh
    # automatic-id signals imported as `active` (compiled into the firmware) instead of `planned`
    active:
      - Throttle_Position
      - Inlet_Manifold_Pressure
      - Wheel_Speed_Front_Left

  - name: e888                      # E888 expansion unit; this name is the registry's can_base
    dbc: messaging/dbc/E8xx.dbc
    base_id: 0xF0
    offsets: [0, 1, 3]              # +0 inputs, +1 status, +3 PWM outputs
    first_id: 1000
    prefix: e888                    # generated names start with this: e888.av1_mv
    names:
      minus_5V: e888.supply_minus_5v_v
      _4_5v: e888.supply_4v5_v
      _8vAux: e888.aux_8v_v
      _5vAux: e888.aux_5v_v
