# Settings for tools/import_can_csv.py: which CAN signals become registry channels, and what
# they are called. Edit this for your own car; the importer code stays generic.

# CAN definition files, relative to the repo root
dbc:
  m130: messaging/dbc/M1_General_0x640_0x650_0x670_Ver5.dbc
  e888: messaging/dbc/E8xx.dbc

# E888 expansion unit: one base CAN id (0xF0, 0xF4, 0xF8 or 0xFC, set in the unit's own
# configuration). Channels are stored as offsets from it, so changing it never renumbers anything.
e888_base_id: 0xF0
e888_offsets: [0, 1, 3]          # +0 inputs, +1 status, +3 PWM outputs

# First id handed out to channels without a pinned id. Ids are permanent once in registry.yaml.
first_id:
  m130: 300
  e888: 1000

# M130 messages to skip entirely (lower-resolution copies of other messages, sent to the PDM)
skip_messages: [0x118, 0x119, 0x11A]

# Signals without a unit are skipped (switches, state enums, version bytes), except these
keep_unitless: [Lap_Number]

# Channels with a hand-picked, permanent id and a friendly name. Key = signal name in the DBC.
pinned:
  Engine_Speed:        { id: 100, name: engine.speed_rpm, priority: 0, active: true }
  Coolant_Temperature: { id: 101, name: coolant.temp_c,   priority: 0, active: true }
  ECU_Battery_Voltage: { id: 102, name: ecu.battery_v,    priority: 1, active: true }

# Friendly names for channels that get an automatic id. Key = signal name in the DBC.
# Signals not listed get a generated name (e.g. ignition.timing_deg).
names:
  Throttle_Position: throttle.position_pct
  Inlet_Manifold_Pressure: intake.manifold_kpa
  Wheel_Speed_Front_Left: wheel.speed_fl_kmh
  Wheel_Speed_Front_Right: wheel.speed_fr_kmh
  Wheel_Speed_Rear_Left: wheel.speed_rl_kmh
  Wheel_Speed_Rear_Right: wheel.speed_rr_kmh
  minus_5V: e888.supply_minus_5v_v
  _4_5v: e888.supply_4v5_v
  _8vAux: e888.aux_8v_v
  _5vAux: e888.aux_5v_v

# Automatic-id signals imported as `active` (compiled into the firmware) instead of `planned`
active:
  - Throttle_Position
  - Inlet_Manifold_Pressure
  - Wheel_Speed_Front_Left
